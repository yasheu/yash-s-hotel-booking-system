
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Internal CSS for Dashboard Grid Layout */
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Columns */
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.4);
            color: #333;
        }

        .icon-placeholder {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.1); 
            padding: 40px;
            border-radius: 15px;
            max-width: 800px;
            margin: 50px auto; 
        }
        
        /* UPDATED: Fixed position to pin to top-right of the SCREEN */
        .logout-btn {
            position: fixed;   /* Sticks to the window */
            top: 20px;         /* Distance from top edge */
            right: 20px;       /* Distance from right edge */
            z-index: 1000;     /* Ensures it sits on top of everything */
            
            background-color: #dc3545;
            text-decoration: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .logout-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>

    <a href="LogoutController" class="logout-btn">Logout</a>

    <header>
        <h1>Hotelora Admin</h1>
    </header>

    <section class="search-box">
        
        <h2 style="margin-top: 10px;">Admin Dashboard</h2>
        
        <div class="dashboard-container">
            
            <a href="ViewAvailableRoomsServlet" class="dashboard-card">
		    <span class="icon-placeholder">➕</span>
		    Add New Room
			</a>

            <a href="ViewRoomsForUpdateServlet" class="dashboard-card">
			    <span class="icon-placeholder">✏️</span>
			    Update Room
			</a>


            <a href="ViewRoomsForDeleteServlet" class="dashboard-card">
                <span class="icon-placeholder">🗑️</span>
                Delete Room
            </a>

           <a href="ViewAllBookingsServlet" class="dashboard-card">
                <span class="icon-placeholder">📅</span>
                View All Bookings
            </a>
            
            <a href="ViewReportServlet" class="dashboard-card">
                <span class="icon-placeholder">📊</span>
                View Report
            </a>

        </div>
    </section>

    <footer>
        &copy; 2025 Hotelora Admin Panel
    </footer>

</body>
</html>
